name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint the OIDC token deploy-pages needs, and write the site.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose -- the action errors out if the version
      # is given both here and as `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `enablement: true` asks GitHub to turn Pages on if it is off. Whether
      # that works depends on the org: in CoderCoop the workflow token is not
      # allowed to create a Pages site ("Resource not accessible by
      # integration"), so Pages has to be switched on once by hand at
      # Settings -> Pages -> Source: GitHub Actions. After that this step just
      # reads the existing configuration and the flag is harmless.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The build uses relative asset paths (see apps/web/vite.config.ts), so
      # no base path needs threading through here.
      - run: pnpm --filter @solsyn/web build

      # The project site is served at the root and the game beneath it, so a
      # visitor lands on an explanation rather than an unlabelled cockpit.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/index.html docs/changelog.html docs/sw.js docs/img _site/
          # The mockups ship as the HTML they were pitched from, not as
          # screenshots of it: the changelog links to them so a decision can be
          # read in the form it was actually made in.
          cp -r docs/mockups _site/
          cp -r apps/web/dist _site/play
          find _site -type f | sort | sed 's/^/  /'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
