name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      # Deliberately not gitleaks-action: v2 requires a paid GITLEAKS_LICENSE
      # for organization-owned repositories, and CoderCoop is an org. The
      # binary is the same scanner without the licence gate.
      - name: Install gitleaks
        run: |
          tag=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${tag#v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks detect --no-banner --redact --exit-code 1

  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose -- the action errors out if the version
      # is given both here and as `packageManager` in package.json, and
      # package.json is the better single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck, lint (including the determinism guard that keeps
      # Math.random and Date.now out of packages/sim), and the property tests.
      - run: pnpm check

  verify:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose -- the action errors out if the version
      # is given both here and as `packageManager` in package.json, and
      # package.json is the better single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds the PWA, serves it, and drives the real thing in a phone
      # viewport -- including a clock-emulated jump forward to prove the ship
      # keeps running while the app is closed.
      - run: pnpm verify

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: .verify-shots/
          if-no-files-found: ignore
          retention-days: 7
